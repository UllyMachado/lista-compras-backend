server.port=8090
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=jdbc:sqlite:lista-compras.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

ai.api.key=${AI_API_KEY}
ai.api.url=${AI_API_URL}
ai.api.model=${AI_API_MODEL}

spring.ai.openai.api-key=${ai.api.key}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=${ai.api.model}

# JWT Configuration
jwt.secret=minha-chave-secreta-lista-compras-2024-muito-longa-para-seguranca-256-bits!!
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000
